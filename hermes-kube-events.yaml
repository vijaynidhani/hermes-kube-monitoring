
apiVersion: v1
kind: Namespace
metadata:
  name: hermes-monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-event-forwarder
  namespace: hermes-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-event-forwarder
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-event-forwarder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-event-forwarder
subjects:
  - kind: ServiceAccount
    name: kube-event-forwarder
    namespace: hermes-monitoring
